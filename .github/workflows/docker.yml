name: Publish container

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to rebuild and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docker-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  DOCKERHUB_IMAGE: docker.io/czyt/localsendy

jobs:
  source:
    name: Verify release source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    outputs:
      build_time: ${{ steps.source.outputs.build_time }}
      release_tag: ${{ steps.source.outputs.release_tag }}
      sha: ${{ steps.source.outputs.sha }}
      short_sha: ${{ steps.source.outputs.short_sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Verify release source
        id: source
        run: |
          set -euo pipefail
          package_version="$(sed -n '/^\[package\]/,/^\[/ s/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "${package_version}"
          test "${RELEASE_TAG}" = "v${package_version}"
          source_sha="$(git rev-parse HEAD)"
          test "$(git rev-list -n 1 "${RELEASE_TAG}")" = "${source_sha}"
          printf 'build_time=%s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "${GITHUB_OUTPUT}"
          printf 'release_tag=%s\n' "${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          printf 'sha=%s\n' "${source_sha}" >> "${GITHUB_OUTPUT}"
          printf 'short_sha=%s\n' "${source_sha:0:7}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.platform }} image
    needs: source
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            platform_tag: arm64
            cache_scope: arm64
          - runner: ubuntu-24.04
            platform: linux/amd64
            platform_tag: amd64
            cache_scope: amd64
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      SOURCE_SHA: ${{ needs.source.outputs.sha }}
      BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out verified source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.source.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Select image targets
        id: images
        env:
          PLATFORM_TAG: ${{ matrix.platform_tag }}
        run: |
          set -euo pipefail
          images=("ghcr.io/${GITHUB_REPOSITORY,,}")
          if [[ -n "${DOCKERHUB_USERNAME}" && -n "${DOCKERHUB_TOKEN}" ]]; then
            images+=("${DOCKERHUB_IMAGE}")
          fi
          {
            printf 'temporary_tags<<EOF\n'
            for image in "${images[@]}"; do
              printf '%s:build-%s-%s-%s\n' \
                "${image}" "${SOURCE_SHA}" "${BUILD_ID}" "${PLATFORM_TAG}"
            done
            printf 'EOF\n'
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push native image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.images.outputs.temporary_tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.source.outputs.release_tag }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
          build-args: |
            VERSION=${{ needs.source.outputs.release_tag }}
            BUILD_TIME=${{ needs.source.outputs.build_time }}
            GIT_COMMIT=${{ env.SOURCE_SHA }}
          cache-from: type=gha,scope=localsendy-${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=localsendy-${{ matrix.cache_scope }}
          provenance: true
          sbom: true

  merge:
    name: Publish multi-platform manifests
    needs: [source, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.source.outputs.release_tag }}
      SOURCE_SHA: ${{ needs.source.outputs.sha }}
      SHORT_SHA: ${{ needs.source.outputs.short_sha }}
      BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Create and verify manifests
        run: |
          set -euo pipefail
          images=("ghcr.io/${GITHUB_REPOSITORY,,}")
          if [[ -n "${DOCKERHUB_USERNAME}" && -n "${DOCKERHUB_TOKEN}" ]]; then
            images+=("${DOCKERHUB_IMAGE}")
          fi
          version="${RELEASE_TAG#v}"
          major_minor="${version%.*}"
          for image in "${images[@]}"; do
            docker buildx imagetools create \
              --tag "${image}:${version}" \
              --tag "${image}:${major_minor}" \
              --tag "${image}:latest" \
              --tag "${image}:sha-${SHORT_SHA}" \
              "${image}:build-${SOURCE_SHA}-${BUILD_ID}-arm64" \
              "${image}:build-${SOURCE_SHA}-${BUILD_ID}-amd64"
            docker buildx imagetools inspect --raw "${image}:${version}" \
              | jq -e '
                  [.manifests[]?.platform
                    | select(.os == "linux")
                    | .architecture] as $architectures
                  | ($architectures | index("amd64")) != null
                    and ($architectures | index("arm64")) != null
                ' >/dev/null
          done
