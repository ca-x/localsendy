[package]
name = "localsendy"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "A Docker-first LocalSend web client powered by Rust"
repository = "https://github.com/ca-x/localsendy"

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.8", features = ["json", "macros", "multipart"] }
chrono = { version = "0.4.43", features = ["serde"] }
if-addrs = "0.15.0"
localsend-rs = { version = "0.1.2", default-features = false, features = ["https"] }
mime_guess = "2.0.5"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
rust-embed = "8.8.0"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
socket2 = { version = "0.6.2", features = ["all"] }
tokio = { version = "1.49.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6.8", features = ["catch-panic", "compression-gzip", "set-header", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.19.0", features = ["serde", "v4"] }

[dev-dependencies]
http-body-util = "0.1.3"
tower = { version = "0.5.2", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
