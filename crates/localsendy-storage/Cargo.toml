[package]
name = "localsendy-storage"
version = "0.3.1"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "SQLite persistence for Localsendy instances and transfers"

[dependencies]
anyhow = "1.0.100"
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[dev-dependencies]
tempfile = "3.24.0"
